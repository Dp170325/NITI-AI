<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Redirecting to NITI AI</title>
    <meta http-equiv="refresh" content="0; url=https://niti-ai.pages.dev/" />
    <link rel="canonical" href="https://niti-ai.pages.dev/" />
    <script>
      (function () {
        var target = "https://niti-ai.pages.dev";
        var path = window.location.pathname.replace(/^\/NITI-AI\/?/, "/") || "/";
        if (path.charAt(0) !== "/") path = "/" + path;
        window.location.replace(target + path + window.location.search + window.location.hash);
      })();
    </script>
  </head>
  <body>
    <p>
      Redirecting to
      <a href="https://niti-ai.pages.dev/">NITI AI on Cloudflare</a>…
    </p>
  </body>
</html>
